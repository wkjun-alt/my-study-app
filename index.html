<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경지사 2차 고득점 마스터</title>
    <style>
        :root { --main: #1e3a8a; --sub: #3b82f6; --bg: #f1f5f9; }
        body { font-family: sans-serif; background: var(--bg); padding: 15px; line-height: 1.5; color: #334155; }
        .hierarchy { font-size: 0.85rem; color: var(--sub); font-weight: 600; margin-bottom: 5px; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); margin-bottom: 20px; border-top: 5px solid var(--main); max-width: 600px; margin: 0 auto; }
        .question-title { font-size: 1.25rem; font-weight: 800; color: #1e293b; margin-bottom: 20px; word-break: keep-all; }
        .score-badge { display: inline-block; background: #fee2e2; color: #ef4444; font-size: 0.75rem; padding: 2px 8px; border-radius: 5px; margin-bottom: 10px; }
        textarea { width: 100%; height: 100px; margin-bottom: 15px; padding: 15px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 1rem; box-sizing: border-box; }
        .btn { width: 100%; padding: 18px; background: var(--main); color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        
        #std-struct { 
            line-height: 1.8; 
            font-size: 0.95rem; 
            border-left: 4px solid var(--main); 
            padding-left: 20px;
            white-space: pre-wrap;
            background: #fff;
            padding: 15px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            margin: 10px 0;
        }
        .ans-section { display: none; margin-top: 25px; }
        .keyword-box { display: flex; flex-wrap: wrap; gap: 8px; background: #eff6ff; padding: 15px; border-radius: 12px; margin-top: 10px; }
        .tag { background: #f8fafc; color: #1e3a8a; border: 1px solid #1e3a8a; padding: 4px 10px; border-radius: 20px; font-size: 0.85rem; font-weight: 500; }
    </style>
</head>
<body>
    <div class="card">
        <div class="hierarchy" id="disp-hierarchy">과목 로딩 중...</div>
        <div class="score-badge">논술형 (30점)</div>
        <div class="question-title" id="disp-q">문제를 불러오는 중입니다...</div>
        
        <p>📝 <strong>답안 목차 구성 (I, II, III...)</strong></p>
        <textarea id="in-struct" placeholder="전체 흐름을 고려하여 3단계 목차를 잡아보세요."></textarea>
        
        <p>🔑 <strong>핵심 키워드 & 학자명</strong></p>
        <textarea id="in-key" placeholder="핵심 키워드 15개를 떠올려보세요."></textarea>
        
        <button class="btn" onclick="showResult()">정답 및 피드백 확인</button>
        
        <div id="ans-area" class="ans-section">
            <div style="font-weight: bold; color: var(--main);">📍 표준 목차 구조 (3단계 Depth)</div>
            <div id="std-struct"></div>
            
            <div style="font-weight: bold; color: var(--main); margin-top: 20px;">📍 필수 핵심 키워드 (15개 내외)</div>
            <div id="std-key" class="keyword-box"></div>
            
            <button class="btn" style="background:#64748b; margin-top:30px;" onclick="location.reload()">다음 문제 도전</button>
        </div>
    </div>
