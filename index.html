<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경지사 2차 암기 마스터</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f9; padding: 15px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .q-text { font-size: 1.1rem; font-weight: bold; color: #1a73e8; margin-bottom: 15px; }
        textarea { width: 100%; height: 80px; margin-bottom: 10px; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; background: #1a73e8; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .result { display: none; background: #e8f0fe; padding: 15px; border-radius: 8px; margin-top: 15px; font-size: 0.9rem; }
        .tag { display: inline-block; background: #34a853; color: white; padding: 2px 8px; border-radius: 10px; font-size: 0.8rem; margin: 2px; }
    </style>
</head>
<body>
    <div class="card">
        <div id="q-area" class="q-text">문제를 불러오는 중...</div>
        <p>1. 목차를 잡아보세요 (I, II, III...)</p>
        <textarea id="ans-struct"></textarea>
        <p>2. 핵심 키워드를 나열해보세요</p>
        <textarea id="ans-key"></textarea>
        <button class="btn" onclick="showAns()">정답 확인</button>
        
        <div id="res-area" class="result">
            <strong>✅ 표준 목차:</strong> <p id="std-struct"></p>
            <strong>✅ 필수 키워드:</strong> <div id="std-key"></div>
            <br>
            <button class="btn" style="background:#5f6368" onclick="location.reload()">다음 문제 (무작위)</button>
        </div>
    </div>

    <script>
        // 여기에 AI가 뽑아준 데이터를 넣을 예정입니다.
        const quizData = [
    {
        q: "전통적 직무분석의 개념, 목적 및 한계점에 관하여 설명하시오.",
        struct: "I. 전통적 직무분석의 의의\nII. 직무분석의 주요 목적 (확보, 개발, 보상 등)\nIII. 전통적 직무분석의 한계점 (동적 환경 대응 미흡 등)\nIV. 결론",
        keys: ["직무기술서", "직무명세서", "과업 중심", "요소비교법", "정적 분석"]
    },
    {
        q: "역량기반 직무분석의 개념 및 목적에 관하여 설명하시오.",
        struct: "I. 역량기반 직무분석의 개념\nII. 도입 배경 및 필요성\nIII. 역량기반 직무분석의 목적 (고성과자 행동특성 추출)\nIV. 전통적 분석과의 차이점",
        keys: ["KSAO", "고성과자", "행동특성", "역량 모델링", "전략적 정렬"]
    },
    {
        q: "임금수준 정책 중 선도정책(lead policy), 매칭정책(matching policy), 지체정책(lag policy)의 내용 및 장단점을 설명하시오.",
        struct: "I. 임금수준 정책의 의의\nII. 선도정책 (시장 상회)\nIII. 매칭정책 (시장 추종)\nIV. 지체정책 (시장 하회)\nV. 정책별 비교 및 시사점",
        keys: ["효율임금", "우수인적자원 확보", "인건비 경쟁력", "노사기대치", "외부 공정성"]
    },
    {
        q: "지속적인 경쟁우위 원천이 되기 위한 인적자원의 4가지 특징(VRIO)을 설명하시오.",
        struct: "I. 자원기반관점(RBV)의 개요\nII. 가치(Value)\nIII. 희소성(Rareness)\nIV. 모방곤란성(Inimitability)\nV. 조직화(Organization)",
        keys: ["VRIO 프레임워크", "자원기반관점", "인적자본", "인과관계 모호성", "경로 의존성"]
    },
    {
        q: "인사평가 오류 중 후광효과(halo effect)와 최근효과(recency effect)에 관하여 설명하시오.",
        struct: "I. 인사평가 오류의 의의\nII. 후광효과 (개념, 원인, 방지대책)\nIII. 최근효과 (개념, 원인, 방지대책)\nIV. 평가 오류 감소를 위한 제언",
        keys: ["일반화의 오류", "기억의 한계", "중요사건기술법", "평가자 교육", "BARS"]
    },
    {
        q: "360도 성과평가(다면평가)의 개념 및 장·단점에 관하여 설명하시오.",
        struct: "I. 다면평가의 의의\nII. 평가 주체의 다양성 (상사, 동료, 부하, 고객)\nIII. 장점 (객관성, 자기계발)\nIV. 단점 (인기투표화, 평가 비용)\nV. 성공적 운영 요건",
        keys: ["자기평가", "피드백 시스템", "수평적 조직", "담합 가능성", "역량 개발"]
    },
    {
        q: "HR Analytics의 개념 및 활용방안에 관하여 설명하시오.",
        struct: "I. HR Analytics의 개념\nII. 분석 단계 (묘사, 진단, 예측, 처방)\nIII. 주요 활용 분야 (채용 예측, 이직 관리)\nIV. 도입 시 고려사항 및 한계",
        keys: ["데이터 기반 의사결정", "빅데이터", "예측 모델링", "증거기반 인사관리", "ROI 분석"]
    },
    {
        q: "허츠버그(F. Herzberg)의 2요인 이론의 기본 가정과 각 요인을 설명하고 예를 제시하시오.",
        struct: "I. 2요인 이론의 개요\nII. 위생요인 (불만족 요인)\nIII. 동기요인 (만족 요인)\nIV. 이론의 시사점 및 한계",
        keys: ["만족과 불만족의 독립성", "직무 충실화", "환경 요인", "심리적 성장", "KITA"]
    },
    {
        q: "빅 파이브(Big-Five) 성격 모델의 5가지 성격 유형을 설명하시오.",
        struct: "I. 성격과 조직행동의 관계\nII. 외향성, 친화성, 성실성, 정서적 안정성, 개방성\nIII. 각 유형별 조직 성과와의 관련성",
        keys: ["외향성", "성실성", "친화성", "신경증", "경험에 대한 개방성"]
    },
    {
        q: "부당노동행위의 유형 중 불이익취급, 황견계약(yellow dog contract), 단체교섭 거부에 관하여 논하시오.",
        struct: "I. 부당노동행위제도의 의의\nII. 불이익취급 (개념 및 요건)\nIII. 황견계약 (비열계약)\nIV. 단체교섭 거부 및 해태\nV. 구제 절차",
        keys: ["노동3권 보장", "반조합적 의사", "비열계약", "성실교섭의무", "노동위원회"]
    }
];

        const item = quizData[Math.floor(Math.random() * quizData.length)];
        document.getElementById('q-area').innerText = "Q. " + item.q;

        function showAns() {
            document.getElementById('res-area').style.display = 'block';
            document.getElementById('std-struct').innerText = item.struct;
            document.getElementById('std-key').innerHTML = item.keys.map(k => `<span class="tag">${k}</span>`).join('');
        }
    </script>
</body>
</html>
