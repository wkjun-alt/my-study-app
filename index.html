<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경지사 2차 고득점 마스터</title>
    <style>
        :root { --main: #1e3a8a; --sub: #3b82f6; --bg: #f1f5f9; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); padding: 15px; line-height: 1.5; color: #334155; }
        .hierarchy { font-size: 0.85rem; color: var(--sub); font-weight: 600; margin-bottom: 5px; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); margin-bottom: 20px; border-top: 5px solid var(--main); }
        .question-title { font-size: 1.25rem; font-weight: 800; color: #1e293b; margin-bottom: 20px; word-break: keep-all; }
        .score-badge { display: inline-block; background: #fee2e2; color: #ef4444; font-size: 0.75rem; padding: 2px 8px; border-radius: 5px; margin-bottom: 10px; }
        textarea { width: 100%; height: 120px; margin-bottom: 15px; padding: 15px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 1rem; box-sizing: border-box; }
        .btn { width: 100%; padding: 18px; background: var(--main); color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        .ans-section { display: none; margin-top: 25px; animation: fadeIn 0.5s; }
        .keyword-box { background: #eff6ff; padding: 15px; border-radius: 12px; margin-top: 10px; }
        .tag { display: inline-block; background: var(--main); color: white; padding: 3px 10px; border-radius: 20px; font-size: 0.8rem; margin: 3px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div class="card">
        <div class="hierarchy" id="disp-hierarchy">인적자원관리 > ...</div>
        <div class="score-badge">논술형 (30점)</div>
        <div class="question-title" id="disp-q">문제를 불러오는 중...</div>
        
        <p>📝 <strong>답안 목차 구성 (I, II, III...)</strong></p>
        <textarea id="in-struct" placeholder="전체 흐름을 고려하여 목차를 잡아보세요."></textarea>
        
        <p>🔑 <strong>핵심 키워드 & 학자명</strong></p>
        <textarea id="in-key" placeholder="채점 포인트가 될 키워드를 나열하세요."></textarea>
        
        <button class="btn" onclick="showResult()">정답 및 피드백 확인</button>
        
        <div id="ans-area" class="ans-section">
            <div style="font-weight: bold; color: var(--main);">📍 표준 목차 구조</div>
            <div id="std-struct" style="white-space: pre-wrap; background: #fff; padding: 15px; border: 1px solid #e2e8f0; border-radius: 10px; margin: 10px 0;"></div>
            
            <div style="font-weight: bold; color: var(--main);">📍 필수 핵심 키워드</div>
            <div id="std-key" class="keyword-box"></div>
            
            <button class="btn" style="background:#64748b; margin-top:20px;" onclick="location.reload()">다음 문제 도전</button>
        </div>
    </div>

    <script>
        // 이 데이터는 제미나이가 전공 서적을 분석하여 채워줄 것입니다.
        const quizData = [
            {
                h: "인적자원관리 > 확보관리 > 직무관리",
                q: "전통적 직무분석과 역량기반 직무분석을 비교 설명하고, 현대적 조직에서의 직무분석 변화 방향에 대해 논하시오.",
                struct: "I. 직무분석의 개요\nII. 전통적 직무분석 (과업/KSAO 중심)\nIII. 역량기반 직무분석 (고성과자 행동특성)\nIV. 양자의 비교 (정적 vs 동적)\nV. 결론: 현대적 시사점",
                keys: ["KSAO", "고성과자 행동특성", "직무 기술서/명세서", "역량 모델링", "전략적 인적자원관리"]
            }
        ];

        const item = quizData[Math.floor(Math.random() * quizData.length)];
        document.getElementById('disp-hierarchy').innerText = item.h;
        document.getElementById('disp-q').innerText = item.q;

        function showResult() {
            document.getElementById('ans-area').style.display = 'block';
            document.getElementById('std-struct').innerText = item.struct;
            document.getElementById('std-key').innerHTML = item.keys.map(k => `<span class="tag">${k}</span>`).join('');
            window.scrollTo(0, document.body.scrollHeight);
        }
    </script>
</body>
</html>
